name: scratch-macos-light

on:
  push:
    branches:
      - iremcaginyurtturk/integration-tests-skipped

jobs:
  light:
    strategy:
      fail-fast: false
      matrix:
        runner: [depot-macos-26, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run light integration tests (no containers)
        env:
          INTEGRATION_BACKENDS: none
        run: |
          make generate
          go test -tags integration -v -run 'TestDestinations_.*/(sqlite|duckdb)' -timeout 15m ./tests/integration/...
