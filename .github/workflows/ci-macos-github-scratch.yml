name: scratch-macos-github

on:
  push:
    branches:
      - iremcaginyurtturk/integration-tests-skipped

jobs:
  intel-native:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEST_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Start Docker (colima, native HVF)
        run: |
          brew install colima docker qemu
          colima start --cpu 4 --memory 8
          docker info
          echo "DOCKER_HOST=$(docker context inspect colima -f '{{.Endpoints.docker.Host}}')" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock" >> "$GITHUB_ENV"
      - name: Run integration suite
        run: |
          make generate
          go test -tags integration -v -p 64 -parallel 8 -timeout 60m ./tests/integration/...

  arm-qemu:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEST_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Start Docker (colima, QEMU backend)
        run: |
          brew install colima docker qemu
          colima start --vm-type qemu --cpu 4 --memory 8
          docker info
          echo "DOCKER_HOST=$(docker context inspect colima -f '{{.Endpoints.docker.Host}}')" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock" >> "$GITHUB_ENV"
      - name: Run integration suite
        run: |
          make generate
          go test -tags integration -v -p 64 -parallel 8 -timeout 60m ./tests/integration/...
