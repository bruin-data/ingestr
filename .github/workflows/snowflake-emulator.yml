name: Snowflake emulator tests

on:
  pull_request:

jobs:
  bruin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      snowflake:
        image: localstack/snowflake-next:latest
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - uses: bruin-data/setup-bruin@main
        with:
          token: ${{ github.token }}

      - name: Install the Snowflake CLI
        run: pipx install snowflake-cli

      - name: Wait for the emulator
        run: |
          until curl -sfk https://snowflake.localhost.localstack.cloud:4566/_localstack/health; do
            sleep 2
          done

      - name: Create the warehouse and database
        run: |
          snow sql --temporary-connection --account test --user test --password test \
            --host snowflake.localhost.localstack.cloud --port 4566 -q "
          CREATE WAREHOUSE IF NOT EXISTS COMPUTE_WH;
          CREATE DATABASE IF NOT EXISTS LOCALSTACK_DEMO;
          CREATE SCHEMA IF NOT EXISTS LOCALSTACK_DEMO._BRUIN_STAGING;"

      - name: Run the pipeline and its checks
        run: bruin run --config-file ci/bruin.emulator.yml --full-refresh localstack-snowflake-nyc-taxi
