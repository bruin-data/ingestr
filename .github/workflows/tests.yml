name: CI Checks

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'resources/**'
      - 'templates/**'
      - 'install.sh'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'resources/**'
      - 'templates/**'
      - 'install.sh'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: true


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bruin-data/ingestr
  INGESTR_DISABLE_TELEMETRY: "true"
  DISABLE_TELEMETRY: "true"

jobs:
  test:
    runs-on: depot-ubuntu-24.04-4
    env:
      # DuckDB's ADBC driver can crash when several package test binaries load it
      # at the same time under race builds.
      TEST_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Run full test suite
        run: make test-full

  end2end:
    runs-on: depot-ubuntu-24.04-4
    env:
      # Skip the testcontainers reaper (ryuk) container. Safe on ephemeral CI
      # runners — they're destroyed after the job, no orphan-container risk.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Pre-pull testcontainer images (background)
        run: |
          # Pull in parallel with go-test compilation; testcontainers will
          # find the image already cached and skip its own pull.
          for img in mongo:7 postgres:16-alpine mysql:8.0 mcr.microsoft.com/mssql/server:2022-latest clickhouse/clickhouse-server:24.3 amazon/dynamodb-local:latest crate:latest pgsty/minio:RELEASE.2026-08-04T00-00-00Z rabbitmq:3-management-alpine starrocks/allin1-ubuntu:3.3-latest gvenzl/oracle-free:23-slim vitess/vttestserver:mysql80 redpandadata/redpanda:v24.2.7 localstack/localstack:3.8.1 cassandra:4.1 maxcompute/maxcompute-emulator:v0.0.7 docker.elastic.co/elasticsearch/elasticsearch:9.4.4; do
            docker pull "$img" >/dev/null 2>&1 &
          done

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Run integration tests
        run: make test-integration

  cdc-stress:
    name: ${{ matrix.name }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres-cdc-stress-test
            target: cdc-postgres-stress-test
            images: |
              postgres:16-alpine
          - name: mysql-cdc-stress-test
            target: cdc-mysql-stress-test
            images: |
              mysql:8.0
              postgres:16-alpine
          - name: mssql-cdc-stress-test
            target: cdc-mssql-stress-test
            images: |
              mcr.microsoft.com/mssql/server:2022-latest
              postgres:16-alpine
    env:
      GOFLAGS: "-p=1"
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Pre-pull testcontainer images (background)
        env:
          TEST_IMAGES: ${{ matrix.images }}
        run: |
          while IFS= read -r img; do
            docker pull "$img" >/dev/null 2>&1 &
          done <<< "$TEST_IMAGES"

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"

      - name: Run ${{ matrix.name }}
        run: make ${{ matrix.target }}

  dockerBuild:
    runs-on: depot-ubuntu-latest
    name: Docker Build
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Depot
        uses: depot/setup-action@v1.7.2

      - name: Build Docker image
        uses: depot/build-push-action@v1.19.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            BRANCH_NAME=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

  lint:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Install linting tools
        run: make setup
      - name: Check formatting
        run: make format-ci
      - name: Run full lint suite
        run: make lint-full

  licenses:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Check third-party license policy
        run: make licenses-check
      - name: Check third-party license audit lock
        run: make licenses-audit
